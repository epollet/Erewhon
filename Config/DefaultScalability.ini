; Réglages de qualité propres à Erewhon (complètent Engine/Config/BaseScalability.ini).

; Les ronds de l'objectif face au Soleil, même en qualité basse : la version simple
; (r.LensFlareQuality=1) ne coûte presque rien, elle réutilise les images du bloom.
[PostProcessQuality@0]
r.LensFlareQuality=1

[PostProcessQuality@1]
r.LensFlareQuality=1
